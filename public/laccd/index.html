<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LACCD Floor Plans — Packet Fusion Site Survey</title>
<!-- Absolute paths: this page lives at /laccd/ but shares the site-wide assets. -->
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-top">
    <div class="brand-mark">
      <img src="/brand/packet-fusion-logo-white.png" alt="Packet Fusion — Powered by Bridgepointe Technologies" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="brand-fallback" style="display:none;">Packet <span>Fusion</span></div>
    </div>
    <div class="app-header-right">
      <a class="powered-by" href="/survey">Open field survey →</a>

      <!-- Populated from /cdn-cgi/access/get-identity; stays hidden when the
           app is not running behind Access (e.g. local dev). -->
      <div class="user-menu" id="userMenu" hidden>
        <button class="user-chip" id="userChip" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="user-name" id="userName"></span>
          <span class="user-caret" aria-hidden="true"></span>
        </button>
        <div class="user-dropdown" id="userDropdown" role="menu" hidden>
          <div class="user-identity">
            <div class="user-identity-name" id="userMenuName"></div>
            <div class="user-identity-email" id="userMenuEmail"></div>
          </div>
          <a class="user-signout" id="userSignOut" role="menuitem" href="/cdn-cgi/access/logout">Sign out</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Floor-plan library for the LACCD project (data/laccd/catalog.json). -->
  <h1>LACCD Floorplan Catalog</h1>
  <p class="subtitle" id="subtitle">Loading...</p>
</header>

<main class="app-main">

  <section class="search-panel">
    <input id="searchInput" type="text" placeholder="Search building, floor, or filename..." autocomplete="off">
    <div class="filters">
      <select id="filterCampus"><option value="">All campuses</option></select>
      <select id="filterBuilding"><option value="">All buildings</option></select>
      <button id="clearFilters" type="button">Clear filters</button>
    </div>
  </section>

  <section class="results-meta">
    <span id="resultCount"></span>
  </section>

  <section id="resultsGrid" class="results-grid"></section>

  <nav id="pagination" class="pagination"></nav>

</main>

<div id="detailOverlay" class="detail-overlay hidden">
  <div class="detail-panel">
    <button id="closeDetail" class="close-btn" type="button" aria-label="Close">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
